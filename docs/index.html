<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Year Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Theme: only --bg and --fg change. Everything else is mixed from them. */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --dim: color-mix(in srgb, var(--fg) 45%, var(--bg));
    --line: color-mix(in srgb, var(--fg) 18%, var(--bg));
    --faint: color-mix(in srgb, var(--fg) 9%, var(--bg));
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: background 0.3s, color 0.3s;
  }
  button, input { font: inherit; color: inherit; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 24px 64px; }

  /* Welcome screen */
  .welcome {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: #0b0302; color: #fff4e8; overflow: hidden;
    transition: opacity 0.6s ease, visibility 0s linear 0.6s;
  }
  .welcome.out { opacity: 0; visibility: hidden; }
  .welcome::before {
    content: ""; position: absolute; inset: -25%;
    background:
      radial-gradient(40% 35% at 50% 62%, rgba(255, 190, 90, 0.45), transparent 70%),
      radial-gradient(55% 45% at 50% 72%, rgba(255, 90, 20, 0.6), transparent 70%),
      radial-gradient(75% 55% at 50% 90%, rgba(170, 20, 0, 0.75), transparent 75%);
    filter: blur(30px);
    animation: glow-in 0.9s ease both, flicker 1.4s ease-in-out 0.9s infinite alternate;
  }
  .w-inner {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    text-align: center; padding: 24px;
  }
  .w-box {
    width: 44px; height: 44px; position: relative;
    border: 1.5px solid #fff4e8;
    box-shadow: 0 0 24px rgba(255, 120, 40, 0.6);
    animation: rise 0.5s ease 0.15s both;
  }
  .w-box::before, .w-box::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 30px; height: 2px; background: #fff4e8;
  }
  .w-box::before { transform: translate(-50%, -50%) rotate(45deg) scaleX(0); animation: draw-a 0.25s ease 0.7s forwards; }
  .w-box::after { transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); animation: draw-b 0.25s ease 0.9s forwards; }
  .w-slogan {
    font-size: clamp(40px, 9vw, 88px); font-weight: 300;
    letter-spacing: -0.03em; line-height: 1;
    text-shadow: 0 0 30px rgba(255, 120, 40, 0.55), 0 0 80px rgba(255, 60, 0, 0.35);
    animation: rise 0.6s ease 0.35s both;
  }
  .w-name {
    font-size: 13px; color: rgba(255, 244, 232, 0.6);
    animation: rise 0.6s ease 0.55s both;
  }

  /* Day complete celebration */
  .celebrate {
    position: fixed; inset: 0; z-index: 90;
    display: grid; place-items: center; overflow: hidden;
    background: rgba(11, 3, 2, 0.85); color: #fff4e8; cursor: pointer;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s;
  }
  .celebrate.show {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity 0.15s ease, visibility 0s;
  }
  .celebrate::before {
    content: ""; position: absolute; inset: -25%;
    background:
      radial-gradient(30% 28% at 50% 45%, rgba(255, 200, 100, 0.5), transparent 70%),
      radial-gradient(50% 42% at 50% 52%, rgba(255, 80, 10, 0.55), transparent 70%),
      radial-gradient(70% 55% at 50% 75%, rgba(170, 20, 0, 0.6), transparent 75%);
    filter: blur(30px);
  }
  .celebrate.show::before { animation: glow-in 0.5s ease both, flicker 0.9s ease-in-out 0.5s infinite alternate; }
  .c-inner { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; }
  .c-flame-wrap { position: relative; display: grid; place-items: center; }
  .c-flame {
    font-size: clamp(96px, 22vw, 180px); line-height: 1;
    filter: drop-shadow(0 0 30px rgba(255, 100, 20, 0.8));
  }
  .c-ring {
    position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid rgba(255, 150, 60, 0.9); opacity: 0;
  }
  .c-num {
    font-size: clamp(64px, 16vw, 128px); font-weight: 400; letter-spacing: -0.04em; line-height: 1;
    margin-top: 8px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px rgba(255, 120, 40, 0.6), 0 0 80px rgba(255, 60, 0, 0.4);
  }
  .c-label { margin-top: 14px; font-size: 15px; color: rgba(255, 244, 232, 0.7); }
  .celebrate.show .c-flame { animation: flame-pop 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
  .celebrate.show .c-ring { animation: ring 0.8s ease-out 0.1s; }
  .celebrate.show .c-num { animation: num-pop 0.6s cubic-bezier(0.2, 1.8, 0.4, 1) 0.2s both; }
  .celebrate.show .c-label { animation: rise 0.5s ease 0.45s both; }
  main.shake { animation: shake 0.4s ease; }

  @keyframes glow-in {
    from { opacity: 0; transform: translateY(8%) scale(0.92); }
    to { opacity: 1; transform: none; }
  }
  @keyframes flicker {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(1.05) translateY(-1%); opacity: 0.85; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes draw-a { to { transform: translate(-50%, -50%) rotate(45deg) scaleX(1); } }
  @keyframes draw-b { to { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1); } }
  @keyframes flame-pop {
    0% { transform: scale(0) rotate(-20deg); }
    60% { transform: scale(1.25) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes num-pop {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes ring {
    0% { opacity: 0.9; transform: scale(0.4); }
    100% { opacity: 0; transform: scale(2.6); }
  }
  @keyframes shake {
    0%, 100% { transform: none; }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 72px; }
  h1 { font-size: 15px; font-weight: 400; }
  .right { display: flex; gap: 20px; align-items: baseline; }
  .link { background: none; border: 0; cursor: pointer; font-size: 15px; color: var(--dim); }
  .link:hover { color: var(--fg); }
  .link:disabled { opacity: 0.35; cursor: default; }

  /* Year dropdown */
  .year-pick { position: relative; }
  .year-btn {
    background: none; border: 0; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 400; color: var(--dim); font-variant-numeric: tabular-nums;
    transition: color 0.2s ease;
  }
  .year-btn:hover, .year-btn[aria-expanded="true"] { color: var(--fg); }
  .chev {
    width: 6px; height: 6px;
    border-right: 1px solid currentColor; border-bottom: 1px solid currentColor;
    transform: translateY(-2px) rotate(45deg);
    transition: transform 0.25s ease;
  }
  .year-btn[aria-expanded="true"] .chev { transform: translateY(1px) rotate(-135deg); }
  .year-menu {
    position: absolute; top: calc(100% + 12px); right: -10px; z-index: 30;
    min-width: 96px; padding: 6px;
    display: flex; flex-direction: column;
    background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
    opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
  }
  .year-menu.open {
    opacity: 1; visibility: visible; transform: translateY(0);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s;
  }
  .year-opt {
    background: none; border: 0; cursor: pointer; text-align: left;
    padding: 8px 10px; font-size: 14px; color: var(--dim); border-radius: 1px;
    font-variant-numeric: tabular-nums;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .year-opt:hover, .year-opt:focus-visible { color: var(--fg); background: var(--faint); outline: none; }
  .year-opt[aria-selected="true"] { color: var(--fg); }

  .date { font-size: clamp(32px, 7vw, 48px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; }
  .sub { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; color: var(--dim); font-size: 14px; margin-top: 10px; }
  .back { background: none; border: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* Streak */
  .streak { white-space: nowrap; color: var(--fg); font-variant-numeric: tabular-nums; }
  .streak.out { color: var(--dim); }
  .streak.out .fl { filter: grayscale(1); opacity: 0.5; }
  .fl { display: inline-block; }
  .fl.pop { animation: pop 0.45s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  .habits { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 32px 0 96px; }
  .habit {
    background: none; border: 1px solid var(--line); border-radius: 2px;
    font-size: 14px; text-align: left; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 24px; cursor: pointer;
    transition: border-color 0.2s; overflow-wrap: anywhere;
  }
  .habit:hover { border-color: var(--dim); }
  .habit:disabled { cursor: default; }
  .habit:disabled:hover { border-color: var(--line); }
  .box { width: 22px; height: 22px; border: 1px solid var(--dim); position: relative; }
  .habit[aria-pressed="true"] .box { background: var(--fg); border-color: var(--fg); }
  .habit[aria-pressed="true"] .box::before,
  .habit[aria-pressed="true"] .box::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 1.5px;
    background: var(--bg); transform: translate(-50%, -50%) rotate(45deg);
  }
  .habit[aria-pressed="true"] .box::after { transform: translate(-50%, -50%) rotate(-45deg); }

  .grid {
    --cols: 2;
    display: grid; grid-template-columns: 18px repeat(12, 1fr); gap: 4px 6px;
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .mh, .tot { text-align: center; }
  .mh { padding-bottom: 6px; }
  .tot { padding-top: 10px; }
  .dn { text-align: right; padding-right: 2px; align-self: center; }
  .mh.now, .dn.now { color: var(--fg); font-weight: 400; }
  .cell {
    aspect-ratio: 1; display: grid; gap: 2px; padding: 2px;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--cols), 1fr);
    background: none; border: 0; cursor: pointer; border-radius: 1px;
  }
  .cell span { background: var(--faint); border-radius: 1px; }
  .cell span.on { background: var(--fg); }
  .cell.future { opacity: 0.35; cursor: default; }
  .cell.sel { outline: 1px solid var(--dim); }
  .cell.today { outline: 2px solid var(--fg); outline-offset: 1px; }
  .cell.void { visibility: hidden; }

  .legend { margin-top: 40px; font-size: 13px; color: var(--dim); line-height: 1.6; }
  footer { margin-top: 8px; font-size: 13px; color: var(--dim); }

  /* Quick bar: appears when the big habit buttons are scrolled away */
  .quick {
    position: fixed; z-index: 20; background: var(--bg);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s;
  }
  .quick.show {
    opacity: 1; visibility: visible; pointer-events: auto; transform: none;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s;
  }
  .q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; }
  .q-day { color: var(--fg); font-weight: 400; }
  .q-list { display: flex; gap: 6px; }
  .q-item {
    background: none; border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    font-size: 13px; text-align: left; white-space: nowrap;
    transition: border-color 0.2s;
  }
  .q-item:hover { border-color: var(--dim); }
  .q-box { width: 14px; height: 14px; flex: none; border: 1px solid var(--dim); position: relative; }
  .q-item[aria-pressed="true"] .q-box { background: var(--fg); border-color: var(--fg); }
  .q-item[aria-pressed="true"] .q-box::before,
  .q-item[aria-pressed="true"] .q-box::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 1.5px;
    background: var(--bg); transform: translate(-50%, -50%) rotate(45deg);
  }
  .q-item[aria-pressed="true"] .q-box::after { transform: translate(-50%, -50%) rotate(-45deg); }

  /* Top bar on phones and smaller windows */
  @media (max-width: 1199px) {
    .quick {
      top: 0; left: 0; right: 0;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      border-bottom: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 10px;
      transform: translateY(-100%);
    }
    .q-head, .q-list { width: 100%; max-width: 672px; margin: 0 auto; }
    .q-list { overflow-x: auto; scrollbar-width: none; }
    .q-list::-webkit-scrollbar { display: none; }
  }
  /* Side panel on wide screens */
  @media (min-width: 1200px) {
    .quick {
      top: 48px; left: calc(50% + 384px); width: 200px;
      display: flex; flex-direction: column; gap: 16px;
      transform: translateX(8px);
    }
    .q-head { flex-direction: column; gap: 4px; }
    .q-list { flex-direction: column; }
    .q-item { white-space: normal; overflow-wrap: anywhere; }
  }

  /* Settings */
  dialog {
    margin: auto; width: min(440px, calc(100% - 32px)); max-height: calc(100% - 48px);
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 2px;
    padding: 32px 28px;
  }
  dialog::backdrop { background: color-mix(in srgb, var(--bg) 70%, transparent); }
  dialog h2 { font-size: 15px; font-weight: 400; margin-bottom: 16px; }
  dialog h2 + * { margin-top: 0; }
  .group + .group { margin-top: 40px; }
  .row { display: flex; gap: 16px; align-items: center; }
  .row input {
    flex: 1; min-width: 0; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 10px 0; font-size: 15px; border-radius: 0;
  }
  .row input:focus { outline: none; border-bottom-color: var(--fg); }
  .row .link { font-size: 13px; }
  .hint { font-size: 13px; color: var(--dim); margin-top: 12px; line-height: 1.5; }
  .add { margin-top: 16px; }
  .themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .theme {
    background: none; border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
    padding: 10px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; text-align: left;
  }
  .theme[aria-pressed="true"] { border-color: var(--fg); }
  .swatch { width: 100%; aspect-ratio: 2; border: 1px solid var(--line); display: grid; place-items: center; }
  .swatch::after { content: ""; width: 10px; height: 10px; background: currentColor; }
  .custom { display: flex; gap: 24px; margin-top: 16px; font-size: 13px; color: var(--dim); }
  .custom label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .custom input { width: 28px; height: 28px; border: 1px solid var(--line); background: none; padding: 0; cursor: pointer; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
  .done { background: var(--fg); color: var(--bg); border: 0; border-radius: 2px; padding: 10px 20px; font-size: 14px; cursor: pointer; }

  :focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

  @media (max-width: 520px) {
    main { padding: 32px 16px 48px; }
    header { margin-bottom: 48px; }
    .habits { grid-template-columns: repeat(2, 1fr); margin-bottom: 64px; }
    .grid { gap: 3px 3px; grid-template-columns: 16px repeat(12, 1fr); }
    .cell { gap: 1px; padding: 1px; }
    .themes { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .w-box::before { transform: translate(-50%, -50%) rotate(45deg); }
    .w-box::after { transform: translate(-50%, -50%) rotate(-45deg); }
  }
</style>
</head>
<body>
<div class="welcome" id="welcome" aria-hidden="true">
  <div class="w-inner">
    <span class="w-box"></span>
    <p class="w-slogan">One box a day.</p>
    <p class="w-name">Year Tracker</p>
  </div>
</div>

<div class="celebrate" id="celebrate" aria-live="polite">
  <div class="c-inner">
    <span class="c-flame-wrap">
      <span class="c-ring" aria-hidden="true"></span>
      <span class="c-flame" aria-hidden="true">🔥</span>
    </span>
    <span class="c-num" id="c-num"></span>
    <span class="c-label" id="c-label"></span>
  </div>
</div>

<main id="main">
  <header>
    <h1>Year Tracker</h1>
    <div class="right">
      <div class="year-pick" id="year-pick">
        <button class="year-btn" id="year-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose year">
          <span id="year-label"></span><span class="chev" aria-hidden="true"></span>
        </button>
        <div class="year-menu" id="year-menu" role="listbox" aria-label="Year"></div>
      </div>
      <button class="link" id="open-settings">Settings</button>
    </div>
  </header>

  <section aria-label="Selected day">
    <p class="date" id="date"></p>
    <div class="sub">
      <span id="count"></span>
      <span class="streak" id="streak"></span>
      <button class="back" id="back" hidden>Back to today</button>
    </div>
    <div class="habits" id="habits"></div>
  </section>

  <section aria-label="Whole year">
    <div class="grid" id="grid"></div>
    <p class="legend" id="legend"></p>
    <footer>Saved on this device.</footer>
  </section>
</main>

<aside class="quick" id="quick" aria-label="Quick habits">
  <div class="q-head">
    <span class="q-day" id="q-day"></span>
    <span class="streak" id="q-streak"></span>
  </div>
  <div class="q-list" id="q-list"></div>
</aside>

<dialog id="settings" aria-label="Settings">
  <div class="group">
    <h2>Habits</h2>
    <div id="habit-list"></div>
    <button class="link add" id="add-habit">Add habit</button>
    <p class="hint">Renaming keeps your history. Up to 9 habits.</p>
  </div>
  <div class="group">
    <h2>Theme</h2>
    <div class="themes" id="themes"></div>
    <div class="custom">
      <label>Background <input type="color" id="custom-bg"></label>
      <label>Text <input type="color" id="custom-fg"></label>
    </div>
  </div>
  <div class="actions">
    <button class="link" id="reset-theme">Reset theme</button>
    <button class="done" id="close-settings">Done</button>
  </div>
</dialog>

<script>
  const DEFAULT_HABITS = [
    { id: "trading", label: "Trading" },
    { id: "reading", label: "Reading" },
    { id: "workout", label: "Workout" },
    { id: "study",   label: "Study" },
  ];
  const THEMES = [
    { name: "Black",    bg: "#000000", fg: "#ffffff" },
    { name: "White",    bg: "#ffffff", fg: "#000000" },
    { name: "Graphite", bg: "#1c1c1e", fg: "#e8e8e6" },
    { name: "Navy",     bg: "#0a1424", fg: "#e6ecf5" },
  ];
  const MAX_HABITS = 9;
  const FUTURE_YEARS = 1;    // how many years after this year show in the dropdown
  const WELCOME_MS = 2000;   // how long the welcome screen stays before fading
  const CELEBRATE_MS = 2000; // how long the day-complete flame stays
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DATA_KEY = "year-tracker-v1";
  const SETTINGS_KEY = "year-tracker-settings-v1";

  // ---------- Storage ----------
  const load = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } };
  const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

  // data looks like: { "2026-11-07": ["trading", "study"] }
  let data = load(DATA_KEY, {});
  let settings = load(SETTINGS_KEY, null) || {};
  if (!Array.isArray(settings.habits) || !settings.habits.length) settings.habits = DEFAULT_HABITS.map((h) => ({ ...h }));
  if (!settings.theme) settings.theme = { bg: THEMES[0].bg, fg: THEMES[0].fg };

  const saveData = () => store(DATA_KEY, data);
  const saveSettings = () => store(SETTINGS_KEY, settings);

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fmt = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const fmtYear = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const fmtShort = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short" });
  const habitIds = () => settings.habits.map((h) => h.id);
  const doneOn = (k) => (data[k] || []).filter((id) => habitIds().includes(id));
  const isFull = (k) => doneOn(k).length === settings.habits.length;
  const boxCols = () => (settings.habits.length <= 1 ? 1 : settings.habits.length <= 4 ? 2 : 3);

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const THIS_YEAR = today.getFullYear();
  let viewYear = THIS_YEAR;
  let selected = new Date(today); // null when viewing another year and no day is picked
  const isViewOnly = () => viewYear !== THIS_YEAR;

  const yearTotal = (y) =>
    Object.keys(data).filter((k) => k.startsWith(`${y}-`)).reduce((sum, k) => sum + doneOn(k).length, 0);

  // ---------- Welcome ----------
  function showWelcome() {
    const w = $("welcome");
    document.documentElement.style.overflow = "hidden";
    setTimeout(() => {
      w.classList.add("out");
      document.documentElement.style.overflow = "";
      setTimeout(() => w.remove(), 700);
    }, WELCOME_MS);
  }

  // ---------- Streak ----------
  // Days in a row where all habits are done. Today only counts once it's complete,
  // but an unfinished today doesn't break the streak.
  let lastStreak = null;

  function currentStreak() {
    const d = new Date(today);
    if (!isFull(keyOf(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (isFull(keyOf(d)) && n < 5000) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function fillStreak(node, n, pop) {
    node.innerHTML = "";
    const flame = el("span", "fl");
    flame.textContent = "🔥";
    flame.setAttribute("aria-hidden", "true");
    if (pop) flame.classList.add("pop");
    node.append(flame, ` ${n} day${n === 1 ? "" : "s"}`);
    node.classList.toggle("out", n === 0);
    node.title = "Days in a row with all habits done";
  }

  function renderStreak() {
    const n = currentStreak();
    const pop = lastStreak !== null && n > lastStreak;
    lastStreak = n;
    fillStreak($("streak"), n, pop);
    fillStreak($("q-streak"), n, pop);
    $("streak").hidden = isViewOnly();
  }

  // ---------- Day complete celebration ----------
  let celebrateTimer = null;

  function celebrate(n) {
    const c = $("celebrate");
    $("c-num").textContent = n;
    $("c-label").textContent = n === 1 ? "day in a row. Keep it lit." : "days in a row. Keep it lit.";
    c.classList.remove("show");
    void c.offsetWidth; // restart the animations
    c.classList.add("show");

    const main = $("main");
    main.classList.remove("shake");
    void main.offsetWidth;
    main.classList.add("shake");

    if (navigator.vibrate) navigator.vibrate([30, 40, 70]);

    clearTimeout(celebrateTimer);
    celebrateTimer = setTimeout(() => c.classList.remove("show"), CELEBRATE_MS);
  }

  $("celebrate").addEventListener("click", () => {
    clearTimeout(celebrateTimer);
    $("celebrate").classList.remove("show");
  });

  // ---------- Theme ----------
  function isLight(hex) {
    const n = parseInt(hex.slice(1), 16);
    return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 150;
  }
  function applyTheme() {
    const { bg, fg } = settings.theme;
    const root = document.documentElement;
    root.style.setProperty("--bg", bg);
    root.style.setProperty("--fg", fg);
    root.style.colorScheme = isLight(bg) ? "light" : "dark";
    document.querySelector('meta[name="theme-color"]').content = bg;
  }
  function setTheme(bg, fg) {
    settings.theme = { bg, fg };
    saveSettings();
    applyTheme();
    renderThemes();
  }

  // ---------- Year dropdown ----------
  const yearBtn = $("year-btn");
  const yearMenu = $("year-menu");
  const yearOptions = () => [...yearMenu.querySelectorAll(".year-opt")];

  function renderYears() {
    const dataYears = Object.keys(data).map((k) => Number(k.slice(0, 4))).filter(Number.isFinite);
    const first = Math.min(THIS_YEAR, ...dataYears);
    const last = THIS_YEAR + FUTURE_YEARS;
    yearMenu.innerHTML = "";
    for (let y = first; y <= last; y++) {
      const o = el("button", "year-opt");
      o.type = "button";
      o.setAttribute("role", "option");
      o.setAttribute("aria-selected", y === viewYear);
      o.tabIndex = -1;
      o.textContent = y;
      o.addEventListener("click", () => pickYear(y));
      yearMenu.append(o);
    }
    $("year-label").textContent = viewYear;
  }

  function openYears() {
    yearMenu.classList.add("open");
    yearBtn.setAttribute("aria-expanded", "true");
    const current = yearOptions().find((o) => o.getAttribute("aria-selected") === "true");
    if (current) current.focus({ preventScroll: true });
  }

  function closeYears(focusButton) {
    yearMenu.classList.remove("open");
    yearBtn.setAttribute("aria-expanded", "false");
    if (focusButton) yearBtn.focus({ preventScroll: true });
  }

  function pickYear(y) {
    viewYear = y;
    selected = y === THIS_YEAR ? new Date(today) : null;
    closeYears(true);
    renderYears();
    render();
  }

  function goToToday() {
    viewYear = THIS_YEAR;
    selected = new Date(today);
    renderYears();
    render();
  }

  yearBtn.addEventListener("click", () => {
    yearMenu.classList.contains("open") ? closeYears(false) : openYears();
  });
  yearMenu.addEventListener("keydown", (e) => {
    const opts = yearOptions();
    const i = opts.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); opts[Math.min(i + 1, opts.length - 1)].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); opts[Math.max(i - 1, 0)].focus(); }
    if (e.key === "Escape" || e.key === "Tab") closeYears(e.key === "Escape");
  });
  document.addEventListener("click", (e) => {
    if (!$("year-pick").contains(e.target)) closeYears(false);
  });

  // ---------- Tracker ----------
  function toggle(id) {
    if (isViewOnly() || !selected) return;
    const k = keyOf(selected);
    const isToday = k === keyOf(today);
    const wasFull = isFull(k);

    const set = new Set(data[k] || []);
    set.has(id) ? set.delete(id) : set.add(id);
    if (set.size) data[k] = [...set]; else delete data[k];
    saveData();
    render();

    // Big flame only when today just became complete
    if (isToday && !wasFull && isFull(k)) celebrate(currentStreak());
  }

  function renderDay() {
    const viewOnly = isViewOnly();
    const total = settings.habits.length;
    const wrap = $("habits");
    wrap.innerHTML = "";

    // Another year, no day picked yet: show the year overview
    if (!selected) {
      $("date").textContent = viewYear;
      $("count").textContent = viewYear > THIS_YEAR
        ? "View only. This year hasn't started yet."
        : `View only. ${yearTotal(viewYear)} habits done this year.`;
      $("back").hidden = false;
      return;
    }

    const k = keyOf(selected);
    const isToday = k === keyOf(today);
    const n = doneOn(k).length;
    $("date").textContent = isToday ? "Today" : (viewOnly ? fmtYear : fmt).format(selected);
    if (isToday) $("count").textContent = `${fmt.format(selected)}, ${n} of ${total} done`;
    else $("count").textContent = viewOnly ? `View only. ${n} of ${total} done.` : `${n} of ${total} done`;
    $("back").hidden = isToday;

    settings.habits.forEach((h) => {
      const b = el("button", "habit");
      b.setAttribute("aria-pressed", doneOn(k).includes(h.id));
      b.disabled = viewOnly;
      const box = el("span", "box"); box.setAttribute("aria-hidden", "true");
      const label = el("span"); label.textContent = h.label;
      b.append(box, label);
      b.addEventListener("click", () => toggle(h.id));
      wrap.append(b);
    });
  }

  function renderGrid() {
    const g = $("grid");
    const isThisYear = viewYear === THIS_YEAR;
    g.innerHTML = "";
    g.style.setProperty("--cols", boxCols());
    g.append(el("span"));
    MONTHS.forEach((m, i) => {
      const s = el("span", "mh");
      if (isThisYear && i === today.getMonth()) s.classList.add("now");
      s.textContent = m[0]; s.title = m;
      g.append(s);
    });

    const totals = Array(12).fill(0);
    for (let d = 1; d <= 31; d++) {
      const dn = el("span", "dn");
      if (isThisYear && d === today.getDate()) dn.classList.add("now");
      dn.textContent = d;
      g.append(dn);
      for (let m = 0; m < 12; m++) {
        const date = new Date(viewYear, m, d);
        if (date.getMonth() !== m) { g.append(el("span", "cell void")); continue; }
        const k = keyOf(date);
        const done = doneOn(k);
        totals[m] += done.length;

        const b = el("button", "cell");
        if (date > today) { b.classList.add("future"); b.disabled = true; }
        if (k === keyOf(today)) b.classList.add("today");
        if (selected && k === keyOf(selected)) b.classList.add("sel");
        b.setAttribute("aria-label", `${fmtYear.format(date)}, ${done.length} of ${settings.habits.length} done`);
        settings.habits.forEach((h) => b.append(el("span", done.includes(h.id) ? "on" : "")));
        b.addEventListener("click", () => { selected = date; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
        g.append(b);
      }
    }
    g.append(el("span"));
    totals.forEach((t) => { const s = el("span", "tot"); s.textContent = t || ""; g.append(s); });

    const names = settings.habits.map((h) => h.label);
    let tip = "Tap a past day to fix it. The 🔥 counts days in a row with all habits done.";
    if (viewYear < THIS_YEAR) tip = "Past years are view only. Tap a day to see it.";
    if (viewYear > THIS_YEAR) tip = "Future years are view only.";
    $("legend").innerHTML = "";
    $("legend").append(
      `One box per habit, left to right: ${names.join(", ")}.`,
      el("br"),
      tip
    );
  }

  // ---------- Quick bar ----------
  let habitsVisible = true;

  function updateQuick() {
    const show = !habitsVisible && !isViewOnly() && !!selected;
    $("quick").classList.toggle("show", show);
  }

  function renderQuick() {
    const list = $("q-list");
    list.innerHTML = "";
    if (!selected || isViewOnly()) { updateQuick(); return; }
    const k = keyOf(selected);
    $("q-day").textContent = k === keyOf(today) ? "Today" : fmtShort.format(selected);
    settings.habits.forEach((h) => {
      const b = el("button", "q-item");
      b.setAttribute("aria-pressed", doneOn(k).includes(h.id));
      const box = el("span", "q-box"); box.setAttribute("aria-hidden", "true");
      const label = el("span"); label.textContent = h.label;
      b.append(box, label);
      b.addEventListener("click", () => toggle(h.id));
      list.append(b);
    });
    updateQuick();
  }

  new IntersectionObserver(([entry]) => {
    habitsVisible = entry.isIntersecting;
    updateQuick();
  }).observe($("habits"));

  function render() { renderDay(); renderGrid(); renderStreak(); renderQuick(); }

  // ---------- Settings ----------
  function renderHabitList() {
    const list = $("habit-list");
    list.innerHTML = "";
    settings.habits.forEach((h, i) => {
      const row = el("div", "row");
      const input = el("input");
      input.value = h.label;
      input.maxLength = 24;
      input.setAttribute("aria-label", `Habit ${i + 1} name`);
      input.addEventListener("input", () => { h.label = input.value.trim() || "Untitled"; saveSettings(); render(); });
      const remove = el("button", "link");
      remove.textContent = "Remove";
      remove.disabled = settings.habits.length <= 1;
      remove.addEventListener("click", () => { settings.habits.splice(i, 1); saveSettings(); renderHabitList(); render(); });
      row.append(input, remove);
      list.append(row);
    });
    $("add-habit").disabled = settings.habits.length >= MAX_HABITS;
  }

  function renderThemes() {
    const wrap = $("themes");
    wrap.innerHTML = "";
    THEMES.forEach((t) => {
      const b = el("button", "theme");
      b.setAttribute("aria-pressed", t.bg === settings.theme.bg && t.fg === settings.theme.fg);
      const sw = el("span", "swatch");
      sw.style.background = t.bg;
      sw.style.color = t.fg;
      const name = el("span"); name.textContent = t.name;
      b.append(sw, name);
      b.addEventListener("click", () => setTheme(t.bg, t.fg));
      wrap.append(b);
    });
    $("custom-bg").value = settings.theme.bg;
    $("custom-fg").value = settings.theme.fg;
  }

  $("add-habit").addEventListener("click", () => {
    settings.habits.push({ id: "h" + Date.now().toString(36), label: "New habit" });
    saveSettings(); renderHabitList(); render();
    const inputs = $("habit-list").querySelectorAll("input");
    inputs[inputs.length - 1].select();
  });
  $("custom-bg").addEventListener("input", (e) => setTheme(e.target.value, settings.theme.fg));
  $("custom-fg").addEventListener("input", (e) => setTheme(settings.theme.bg, e.target.value));
  $("reset-theme").addEventListener("click", () => setTheme(THEMES[0].bg, THEMES[0].fg));
  $("open-settings").addEventListener("click", () => { renderHabitList(); renderThemes(); $("settings").showModal(); });
  $("close-settings").addEventListener("click", () => $("settings").close());
  $("back").addEventListener("click", goToToday);

  // ---------- Start ----------
  showWelcome();
  renderYears();
  applyTheme();
  render();
</script>
</body>
</html>
